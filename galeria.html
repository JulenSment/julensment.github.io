---
layout: gallerias
title: Galeria
permalink: /galeria/
galleria: true
---

	{% include partials/header.html %}
    <main id="page-main" role="main" class="whitebackground">
	<div id="layout" class="listed">
    	<h3 class="anm-moveFromLeftFade delay-500"><u>Il·lustracions</u></h3>
		<section class="anm-fadeIn delay-600">		
	{% assign image_files = site.static_files | where: "image", true %}
	{% for image in image_files %}
		<article>
    		<a href="{{ site.baseurl }}/assets/creations/{{ image.name }}" data-lightbox="roadtrip"><img class="imagens" src="{{ site.baseurl }}/assets/creations/{{ image.name }}" alt="il·lustració"></a>
		</article>
	{% endfor %}
		</section>
        <hr>
	</div><!-- /#Layout -->
	</main>
